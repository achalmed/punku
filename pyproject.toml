# pyproject.toml — el paquete de Python de Punku (la Mesa de Partes): dependencias y extras
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "punku"
version = "0.1.0"
description = "Punku: la Mesa de Partes de la plataforma Qillqa (los documentos recibidos, la mesa de partes virtual pública con su cargo en PDF y su seguimiento), que funciona dentro de Qillqa o sola con el anfitrión mínimo de Tiqsi."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = ["tiqsi", "fastapi>=0.110", "pydantic-settings>=2", "PyJWT>=2.8", "python-multipart>=0.0.9",
                "sqlalchemy[asyncio]>=2", "asyncpg>=0.29", "Pillow>=10", "python-multipart>=0.0.9"]

[project.optional-dependencies]
sola = ["uvicorn[standard]>=0.30"]
pruebas = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["punku"]
